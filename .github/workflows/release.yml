name: Release to PyPI

# Runs when a version tag (e.g. 1.0.2) is pushed, e.g. by zest.releaser's
# `fullrelease`. Publishing is gated by the "pypi" GitHub environment, whose
# required reviewers must approve the deployment before anything is uploaded.
on:
    push:
        tags:
          - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
    contents: read

jobs:
    build:
        name: Build distributions
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Install build tools
              run: python -m pip install --upgrade build twine
            - name: Check tag matches package version
              run: |
                  version=$(python setup.py --version)
                  if [ "$version" != "$GITHUB_REF_NAME" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match setup.py version $version"
                    exit 1
                  fi
            - name: Build sdist and wheel
              run: python -m build
            - name: Check distributions
              run: twine check --strict dist/*
            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/

    publish:
        name: Publish to PyPI
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/project/collective.volto.otp/${{ github.ref_name }}/
        permissions:
            id-token: write  # required for trusted publishing (OIDC)
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/
            - uses: pypa/gh-action-pypi-publish@release/v1
